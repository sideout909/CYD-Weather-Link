[platformio]
default_envs = panellan_sc05_x
boards_dir = boards

[env:panellan_sc05_x]
platform = espressif32@6.12.0
board = panellan_sc05_x
framework = arduino
board_build.partitions = default_8MB.csv
board_build.embed_files = certs/x509_crt_bundle.bin
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@6.21.5
    https://github.com/smartpanle/PanelLan_esp32_arduino.git#2bc0d086c9a55f5288d85da6c16968c22744fe5f
    jgromes/RadioLib@7.7.1
    https://github.com/NorthernMan54/rtl_433_ESP.git#f0a81569b58a60ea8b3a5efd8e9b39670e8d8df8
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -include atlas_devices.h
    -DRF_CC1101="CC1101"
    -DRF_MODULE_SCK=10
    -DRF_MODULE_MISO=11
    -DRF_MODULE_MOSI=12
    -DRF_MODULE_CS=13
    -DRF_MODULE_GDO0=14
    -DRF_MODULE_GDO2=21
    -DLOG_LEVEL=0
monitor_speed = 115200
upload_speed = 460800
